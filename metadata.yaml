name: astrbot_plugin_model_hub
display_name: 模型总控台
short_desc: 一处查看并切换 AstrBot 本体与所有插件用到的大模型
desc: >-
  自动发现 AstrBot 各配置文件（对话、回退、上下文压缩、图片转述、语音）以及所有插件在配置里声明的模型选择字段，
  在插件页面里集中查看、逐项修改，或一键把所有对话类模型切到同一个模型；可保存多套方案随时切换。
  改动会写回各自的配置文件，并按 AstrBot 原生方式热生效（重载流水线 / 重载插件 / 插件自带热更新钩子）。
help: /模型总控 查看当前模型；/模型总控 全切 <provider_id>；/模型总控 方案 <方案名>
version: 1.0.0
author: vivy1024
repo: https://github.com/vivy1024/astrbot_plugin_model_hub
social_link: https://github.com/vivy1024
astrbot_version: ">=4.17.0"
tags:
